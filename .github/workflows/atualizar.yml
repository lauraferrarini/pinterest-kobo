name: Atualizar fotos

on:
  workflow_dispatch:
  push:
    paths:
      - pastas.txt

permissions:
  contents: write

concurrency:
  group: atualizar-fotos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: pip install gallery-dl pillow

      - name: Baixar pins novos e gerar o site
        run: python scripts/atualizar.py

      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "robo-das-fotos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site dados
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Fotos atualizadas"
            git push
          fi
