{
    "extractor": {
        "base-directory": "site/fotos/",
        "archive": "dados/baixados.sqlite3",
        "path-restrict": "auto",
        "sleep-request": 0.5,
        "retries": 4,

        "pinterest": {
            "videos": false,
            "sections": true,
            "filename": "{id}{media_id|page_id:?_//}.{extension}",

            "board": {
                "directory": ["{board[name]}"],
                "archive-format": "{board[id]}_{id}_{media_id|page_id}"
            },
            "section": {
                "directory": ["{board[name]}", "{section[title]}"],
                "archive-format": "{board[id]}_{section[id]}_{id}_{media_id|page_id}"
            }
        }
    },
    "output": {
        "mode": "pipe",
        "progress": false
    }
}
